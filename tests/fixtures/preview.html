<!doctype html><html lang="en"><meta charset="utf-8"><title>Suno localization — synthetic fixture</title>
<style>body{font:16px system-ui;background:#191919;color:#eee;margin:32px;max-width:1000px}a{color:#f4a574;margin:12px}button,input,textarea{font:inherit;padding:10px;margin:8px;border-radius:8px}section,aside,article{border:1px solid #555;padding:20px;margin:16px 0}label,span{margin:12px}textarea,[contenteditable]{background:#333;color:#fff;padding:12px}#menu{background:#333;padding:12px}</style>
<h1>本地合成页面 · 无真实账户数据</h1><aside id="userscript-menu"></aside>
<nav><a href="/discover">Explore</a><a href="/create">Create</a><a href="/me">Library</a><a href="/studio">Studio</a></nav>
<main id="main"></main>
<script>
window.GM_getValue=(k,d)=>JSON.parse(localStorage.getItem(k)??JSON.stringify(d));
window.GM_setValue=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
window.GM_unregisterMenuCommand=()=>document.getElementById('userscript-menu').replaceChildren();
window.GM_registerMenuCommand=(label,callback)=>{const b=document.createElement('button');b.textContent=label;b.onclick=callback;document.getElementById('userscript-menu').append(b);return 1};
const main=document.getElementById('main');
if(location.pathname==='/create'||location.pathname.startsWith('/song/')){
 main.innerHTML=`<section><span role="tablist" aria-label="Create form mode"><button role="tab" aria-label="Simple">Simple</button><button role="tab" aria-label="Advanced">Advanced</button><button role="tab" aria-label="Sounds">Sounds</button></span><button>Audio</button><button>Voice</button><button>Inspo</button><h2>Lyrics</h2><div role="textbox" aria-label="Lyrics editor" contenteditable="true">Create</div><h2>Styles</h2><div data-testid="create-form-styles-wrapper"><textarea aria-label="Styles input">Styles</textarea></div><div role="button" tabindex="0" id="options">More Options</div><div id="advanced" hidden><span>Vocal Gender</span><button>Male</button><button>Female</button><span>Weirdness</span><span>Style Influence</span><span>Variety</span><span>Personalize</span></div><button disabled>Create</button></section><article class="clip-title-wrapper"><a href="/song/synthetic">Create</a></article>`;
 document.getElementById('options').onclick=()=>document.getElementById('advanced').hidden=!document.getElementById('advanced').hidden;
 document.querySelectorAll('[role=tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[role=tab]').forEach(x=>x.setAttribute('aria-selected','false'));b.setAttribute('aria-selected','true')});
}else{
 main.innerHTML=`<div role="tablist"><a role="tab" href="/me">Songs</a><a role="tab" href="/me/playlists">Playlists</a><a role="tab" href="/me/workspaces">Workspaces</a></div><input placeholder="Search songs" value="Create"><button id="filter" role="combobox" aria-label="Filters (2)" aria-controls="filter-popup">Filters (2)</button><article><a href="/song/synthetic">Create</a><button id="more" aria-label="More options">⋯</button></article>`;
 document.getElementById('filter').onclick=()=>{const old=document.getElementById('filter-popup');if(old){old.remove();return}const e=document.createElement('div');e.id='filter-popup';e.setAttribute('role','listbox');e.innerHTML='<div role="option">Public</div><div role="option">Private</div><div role="option">Hide Stems</div>';document.body.append(e)};
 document.getElementById('more').onclick=()=>{const old=document.getElementById('menu');if(old){old.remove();return}const e=document.createElement('div');e.id='menu';e.innerHTML='<div class="context-menu-item"><button aria-label="Share">Share</button></div><div class="context-menu-item"><button aria-label="Download">Download</button></div>';document.body.append(e)};
}
</script><script src="/suno-zh.js"></script></html>
